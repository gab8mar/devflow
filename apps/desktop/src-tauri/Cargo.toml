[package]
name = "devtime-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "devtime_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devtime-application = { path = "../../../crates/devtime-application" }
devtime-domain = { path = "../../../crates/devtime-domain" }
devtime-infrastructure = { path = "../../../crates/devtime-infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v7"] }
